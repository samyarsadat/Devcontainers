name: Push Features & Templates
on:
    release:
        types:
            - published
    pull_request: &changes
        branches:
            - main
        paths:
            - src/**
            - templates/**
            - .github/workflows/features.yml
    push: *changes

concurrency: features-${{github.ref}}

jobs:
    validate:
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        name: Validate Features & Templates
        runs-on: ubuntu-latest
        permissions:
            contents: read
        
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v7

            - name: Validate Features
              uses: devcontainers/action@v1
              with:
                  validate-only: true
                  base-path-to-features: ./src

            - name: Validate Template JSON
              run: find templates -type f -name "*.json" -exec jq empty {} +

    publish:
        if: github.event_name == 'release'
        name: Publish Features & Templates
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v7

            - name: Inject Release Version
              run: |
                  version="${GITHUB_REF_NAME#v}"
                  for metadata in src/*/devcontainer-feature.json templates/*/devcontainer-template.json; do
                      jq --arg version "$version" '.version = $version' "$metadata" > "$metadata.tmp"
                      mv "$metadata.tmp" "$metadata"
                  done

            - name: Publish Features
              uses: devcontainers/action@v1
              with:
                  publish-features: true
                  base-path-to-features: ./src
                  features-namespace: samyarsadat/devcontainers/features
                  disable-repo-tagging: true
              env:
                  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

            - name: Publish Templates
              uses: devcontainers/action@v1
              with:
                  publish-templates: true
                  base-path-to-templates: ./templates
                  templates-namespace: samyarsadat/devcontainers/templates
                  disable-repo-tagging: true
              env:
                  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
