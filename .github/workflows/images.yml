name: Build & Push Images
on:
    workflow_dispatch:
    schedule:
        - cron: "30 5 * * TUE"   # Every Tuesday at 05:30 AM UTC
    pull_request:
        branches:
            - main
        paths:
            - profiles/**
            - .github/workflows/images.yml

permissions:
    contents: read
    packages: write

concurrency: images-${{github.ref}}

jobs:
    build:
        if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
        name: ${{matrix.tag}}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                tag:
                    - pico-sdk
                    - pico-microros-jazzy
                    - ros-desktop-jazzy
        
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v7

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Log in to GitHub Packages Registry
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{github.actor}}
                  password: ${{secrets.GITHUB_TOKEN}}

            - name: Build & Push Image
              uses: devcontainers/ci@v0.3
              with:
                  configFile: profiles/${{matrix.tag}}/devcontainer.json
                  imageName: ghcr.io/samyarsadat/devcontainers/profiles/${{matrix.tag}}
                  imageTag: latest,${{github.sha}}
                  push: ${{case(github.event_name == 'pull_request', 'never', 'always')}}
                  cacheFrom: type=gha,scope=${{matrix.tag}}
                  cacheTo: ${{case(github.event_name != 'pull_request', format('type=gha,scope={0},mode=max', matrix.tag), '')}}
